<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facing Silhouette</title>
    <style>
      body {
        margin: 0;
      }

      #webgl-output {
        position: relative;
        overflow: hidden;
        background: #fff;
      }

      #preview-labels {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .preview-label {
        position: absolute;
        transform: translate(-50%, -100%);
        margin-top: -4px;
        padding: 1px 6px;
        color: #fff;
        background: rgba(17, 17, 17, 0.92);
        font: 12px/1.4 "Microsoft YaHei", sans-serif;
        white-space: nowrap;
      }

      canvas {
        display: block;
      }
    </style>
  </head>
  <script type="importmap">
    {
      "imports": {
        "three": "../lib/three/build/three.module.js",
        "three/examples/jsm/": "../lib/three/examples/jsm/"
      }
    }
  </script>
  <body>
    <div id="webgl-output"></div>
    <script src="./facingSilhouette.js" type="module"></script>
  </body>
</html>
